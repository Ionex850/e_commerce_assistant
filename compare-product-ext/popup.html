<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --stone-50:  #f6f4f0;
    --stone-100: #ece8e0;
    --stone-300: #c9c2b4;
    --ink-900:   #232019;
    --ink-600:   #5c5648;
    --plum-600:  #6e3b4f;
    --plum-700:  #5a2f41;
    --moss-500:  #6f7a5e;
    --green-500: #4a7c59;
    --red-400:   #b85c5c;
    --shadow:    0 8px 28px -10px rgba(35,32,25,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 340px;
    background: var(--stone-50);
    font-family: 'Inter', sans-serif;
    color: var(--ink-900);
    padding: 0 0 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- header ---- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--stone-100);
    background: #fff;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .brand .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--plum-600);
  }
  .brand .sub {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 0.78rem;
    color: var(--ink-600);
    margin-left: 2px;
  }
  .clear-all {
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    color: var(--stone-300);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    transition: color 0.2s;
  }
  .clear-all:hover { color: var(--red-400); }

  /* ---- instruction ---- */
  .instruction {
    font-size: 0.78rem;
    color: var(--ink-600);
    padding: 12px 20px 0;
    line-height: 1.5;
  }

  /* ---- slots ---- */
  .slots {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 16px 0;
  }

  .slot {
    background: #fff;
    border-radius: 16px;
    border: 1.5px solid var(--stone-100);
    padding: 14px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .slot.captured {
    border-color: var(--moss-500);
    box-shadow: 0 0 0 3px rgba(111,122,94,0.1);
  }

  .slot-label {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--stone-300);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .slot.captured .slot-label { color: var(--moss-500); }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--stone-300);
    flex-shrink: 0;
  }
  .slot.captured .status-dot { background: var(--moss-500); }

  .slot-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--ink-900);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: none;
  }
  .slot.captured .slot-title { display: block; }

  .slot-url {
    font-size: 0.72rem;
    color: var(--stone-300);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 10px;
    display: none;
  }
  .slot.captured .slot-url { display: block; color: var(--ink-600); }

  .slot-empty-hint {
    font-size: 0.82rem;
    color: var(--stone-300);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .slot.captured .slot-empty-hint { display: none; }

  .slot-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .capture-btn {
    flex: 1;
    background: var(--ink-900);
    color: var(--stone-50);
    border: none;
    border-radius: 999px;
    padding: 9px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: background 0.2s, transform 0.15s;
  }
  .capture-btn:hover { background: var(--plum-700); }
  .capture-btn:active { transform: scale(0.96); }
  .slot.captured .capture-btn {
    background: var(--stone-100);
    color: var(--ink-600);
  }
  .slot.captured .capture-btn:hover { background: var(--stone-100); color: var(--red-400); }

  .capture-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

  .remove-btn {
    background: none;
    border: none;
    padding: 6px;
    cursor: pointer;
    color: var(--stone-300);
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
  }
  .remove-btn:hover { color: var(--red-400); }
  .slot.captured .remove-btn { display: flex; }
  .remove-btn svg { width: 14px; height: 14px; }

  textarea#queryIndex {
    width: 100%;
    border: none;
    resize: none;
    outline: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    color: var(--ink-900);
    padding: 4px;
    line-height: 1.5;
  }

  /* ---- divider ---- */
  .vs-divider {
    text-align: center;
    font-family: 'Fraunces', serif;
    font-size: 0.75rem;
    color: var(--stone-300);
    letter-spacing: 0.12em;
    margin: -2px 0;
  }

  /* ---- save button ---- */
  .save-section {
    padding: 16px 16px 0;
  }
  .save-btn {
    width: 100%;
    background: var(--plum-600);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 13px 20px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    transition: background 0.2s, transform 0.15s, opacity 0.2s;
  }
  .save-btn:hover { background: var(--plum-700); }
  .save-btn:active { transform: scale(0.98); }
  .save-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
  }
  .save-btn svg { width: 15px; height: 15px; }

  /* ---- toast ---- */
  .toast {
    position: fixed;
    bottom: 12px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--ink-900);
    color: #fff;
    font-size: 0.78rem;
    padding: 8px 16px;
    border-radius: 999px;
    white-space: nowrap;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.success { background: var(--green-500); }
  .toast.error   { background: var(--red-400); }

  /* ---- footer ---- */
  .footer {
    padding: 14px 20px 0;
    font-size: 0.7rem;
    color: var(--stone-300);
    text-align: center;
    line-height: 1.5;
  }

  /* ---- spinner (inside capture btn) ---- */
  .spin {
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <span class="dot"></span>
    Cart <span class="sub">compare</span>
  </div>
  <button class="clear-all" id="clearAll" title="Clear both slots">Clear all</button>
</div>

<p class="instruction">Navigate to a product page, then capture it into a slot.</p>

<div class="slots">

  <!-- Slot A -->
  <div class="slot" id="slotA">
    <div class="slot-label">
      <span class="status-dot"></span>
      Product A
    </div>
    <div class="slot-title" id="titleA">—</div>
    <div class="slot-url"   id="urlA">—</div>
    <div class="slot-empty-hint">Open any product page and click "Capture".</div>
    <div class="slot-actions">
      <button class="capture-btn" id="captureA">
        <svg id="iconA" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <span id="labelA">Capture this tab</span>
      </button>
      <button class="remove-btn" id="removeA" title="Remove">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="vs-divider">vs</div>

  <!-- Slot B -->
  <div class="slot" id="slotB">
    <div class="slot-label">
      <span class="status-dot"></span>
      Product B
    </div>
    <div class="slot-title" id="titleB">—</div>
    <div class="slot-url"   id="urlB">—</div>
    <div class="slot-empty-hint">Open a second product page and click "Capture".</div>
    <div class="slot-actions">
      <button class="capture-btn" id="captureB">
        <svg id="iconB" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <span id="labelB">Capture this tab</span>
      </button>
      <button class="remove-btn" id="removeB" title="Remove">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="slot" id="user_query_slot">
    <textarea id='queryIndex' rows='1' placeholder="What do you need?"></textarea>
  </div>

</div>

<div class="save-section">
  <button class="save-btn" id="saveBtn" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Save both pages
  </button>
</div>

<div class="footer">Files saved as HTML · Pass them to your Python backend</div>
<div class="toast" id="toast"></div>

<script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root{
    --stone-50:  #f6f4f0;
    --stone-100: #ece8e0;
    --stone-300: #c9c2b4;
    --ink-900:   #232019;
    --ink-600:   #5c5648;
    --plum-600:  #6e3b4f;
    --plum-700:  #5a2f41;
    --moss-500:  #6f7a5e;
    --radius-lg: 22px;
    --radius-md: 14px;
    --shadow-soft: 0 8px 30px -12px rgba(35,32,25,0.18);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--stone-50);
    color:var(--ink-900);
    font-family:'Inter', sans-serif;
  }

  ::selection{ background:var(--plum-600); color:white; }

  .screen{
    min-height:100vh;
    display:none;
    flex-direction:column;
    align-items:center;
  }
  .screen.active{ display:flex; }

  /* ---------- top bar ---------- */
  .topbar{
    width:100%;
    max-width:680px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:28px 24px 0;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.15rem;
    letter-spacing:0.01em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--plum-600);
    display:inline-block;
  }

  /* ---------- category selector ---------- */
  .category-select{
    position:relative;
  }
  .category-select select{
    appearance:none;
    -webkit-appearance:none;
    background:transparent;
    border:none;
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:0.92rem;
    color:var(--ink-600);
    padding:8px 26px 8px 4px;
    cursor:pointer;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .category-select select:hover,
  .category-select select:focus{
    color:var(--ink-900);
    border-bottom:1px solid var(--stone-300);
    outline:none;
  }
  .category-select::after{
    content:"";
    position:absolute;
    right:4px; top:50%;
    width:7px; height:7px;
    border-right:1.5px solid var(--ink-600);
    border-bottom:1.5px solid var(--ink-600);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }

  /* ---------- greeting screen ---------- */
  #greeting{
    justify-content:center;
    padding-bottom:10vh;
  }
  .hero{
    width:100%;
    max-width:680px;
    padding:24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:30px;
  }
  .hero h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(1.8rem, 4vw, 2.5rem);
    line-height:1.25;
    margin:0;
    color:var(--ink-900);
  }
  .hero h1 em{
    font-style:italic;
    color:var(--plum-600);
  }
  .hero p.sub{
    margin:-14px 0 0;
    color:var(--ink-600);
    font-size:0.98rem;
  }

  .prompt-box{
    width:100%;
    background:#fff;
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-soft);
    border:1px solid var(--stone-100);
    padding:6px 6px 14px;
    text-align:left;
  }
  .prompt-box textarea{
    width:100%;
    border:none;
    resize:none;
    outline:none;
    background:transparent;
    font-family:'Inter', sans-serif;
    font-size:1.02rem;
    color:var(--ink-900);
    padding:18px 18px 4px;
    min-height:64px;
    line-height:1.5;
  }
  .prompt-box textarea::placeholder{
    color:#a9a194;
  }
  .prompt-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
  }
  .hint{
    font-size:0.78rem;
    color:#a9a194;
    padding-left:6px;
  }
  .send-btn{
    width:40px; height:40px;
    border-radius:50%;
    border:none;
    background:var(--ink-900);
    color:var(--stone-50);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.15s ease;
  }
  .send-btn:hover{ background:var(--plum-700); }
  .send-btn:active{ transform:scale(0.92); }
  .send-btn svg{ width:16px; height:16px; }

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }
  .chip{
    font-size:0.83rem;
    color:var(--ink-600);
    background:var(--stone-100);
    border:1px solid transparent;
    border-radius:999px;
    padding:8px 16px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .chip:hover{
    background:#fff;
    border-color:var(--stone-300);
    color:var(--ink-900);
  }

  /* ---------- results screen ---------- */
  #results{
    align-items:stretch;
    padding-bottom:60px;
  }
  .results-topbar{
    width:100%;
    max-width:880px;
    margin:0 auto;
    padding:28px 24px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .back-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    color:var(--ink-600);
    cursor:pointer;
    padding:6px 4px;
  }
  .back-btn:hover{ color:var(--ink-900); }
  .back-btn svg{ width:13px; height:13px; }

  .query-banner{
    width:100%;
    max-width:880px;
    margin:22px auto 4px;
    padding:0 24px;
  }
  .query-banner .label{
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#a9a194;
    margin-bottom:6px;
  }
  .query-banner .text{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    font-weight:500;
    color:var(--ink-900);
  }

  .results-list{
    width:100%;
    max-width:880px;
    margin:26px auto 0;
    padding:0 24px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .result-card{
    background:#fff;
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-soft);
    border:1px solid var(--stone-100);
    padding:20px 22px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }
  .result-card:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 34px -14px rgba(35,32,25,0.26);
  }

  .source-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .source-badge{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:0.72rem;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:4px 10px 4px 6px;
    border-radius:999px;
    color:#fff;
  }
  .source-badge .swatch{
    width:16px; height:16px;
    border-radius:50%;
    background:rgba(255,255,255,0.35);
    display:flex;align-items:center;justify-content:center;
    font-size:9px;
  }
  .price-tag{
    margin-left:auto;
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.05rem;
    color:var(--ink-900);
  }

  .result-card h3{
    margin:2px 0 0;
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.12rem;
    color:var(--ink-900);
  }
  .result-card p{
    margin:0;
    font-size:0.92rem;
    line-height:1.55;
    color:var(--ink-600);
  }
  .card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
  }
  .card-footer .meta{
    font-size:0.78rem;
    color:#a9a194;
  }
  .view-link{
    font-size:0.82rem;
    font-weight:600;
    color:var(--plum-600);
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .view-link:hover{ color:var(--plum-700); }

  /* loading state */
  .loading-wrap{
    width:100%;
    max-width:880px;
    margin:80px auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    color:var(--ink-600);
    font-size:0.92rem;
  }
  .spinner{
    width:26px; height:26px;
    border-radius:50%;
    border:2.5px solid var(--stone-100);
    border-top-color:var(--plum-600);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .error-msg {
    width: 100%;
    max-width: 880px;
    margin: 22px auto 4px;
    padding: 0 24px;
  }

  @media (max-width: 600px){
    .hero{ padding:16px; gap:22px; }
    .results-list, .query-banner, .results-topbar{ padding-left:16px; padding-right:16px; }
  }
</style>
</head>
<body>

<!-- ========================= GREETING SCREEN ========================= -->
<section id="greeting" class="screen active">
  <div class="topbar">
    <div class="category-select">
      <select id="categorySelect">
        <option value="select">Select category</option>
        <option value="shopping">Online shopping</option>
        <option value="fashion">Fashion</option>
        <option value="food">Food</option>
        <option value="grocery">Grocery</option>
        <option value="transport">Transport</option>
      </select>
    </div>
  </div>

  <div class="hero">
    <h1>What are you <em>looking</em> for today?</h1>
    <p class="sub">Describe it in your own words — I'll compare prices and options across stores.</p>

    <div class="prompt-box">
      <textarea id="queryInput" rows="1" placeholder="e.g. a lightweight running shoe for flat feet, under ₹6000"></textarea>
      <div class="prompt-actions">
        <span class="hint">Press Enter to search</span>
        <button class="send-btn" id="sendBtn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <div class="chip-row">
      <span class="chip" data-fill="Noise-cancelling headphones for travel, around ₹8000">Headphones for travel</span>
      <span class="chip" data-fill="A birthday gift for a 10-year-old who loves dinosaurs">Gift for a kid</span>
      <span class="chip" data-fill="Comfortable office chair with lumbar support">Office chair</span>
      <span class="chip" data-fill="Organic skincare for sensitive, dry skin">Skincare set</span>
    </div>
  </div>
</section>

<!-- ========================= RESULTS SCREEN ========================= -->
<section id="results" class="screen">
  <div class="results-topbar">
    <div class="brand"><span class="dot"></span>Cart</div>
    <button class="back-btn" id="backBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      New search
    </button>
  </div>

  <div class="query-banner">
    <div class="label">Showing results for</div>
    <div class="text" id="queryEcho">—</div>
  </div>

  <div id="loadingWrap" class="loading-wrap" style="display:none;">
    <div class="spinner"></div>
    <span>Comparing stores…</span>
  </div>

  <div id="errorMsg"  class="error-msg" hidden>
    <span>There was an internal error loading the results.</span>
  </div>

  <div class="results-list" id="resultsList"></div>
</section>

<script>
  // ---------------- dummy data ----------------
  // In the real app, this list will come from the local Python backend's response.
  const DUMMY_RESULTS = [
    {
      store: "Amazon",
      color: "#232f3e",
      initial: "a",
      title: "Sleek Wireless Running Shoes — Flexi Sole",
      description: "Breathable mesh upper with arch support, designed for flat-footed runners. Lightweight cushioning keeps long runs comfortable.",
      price: "₹4,299",
      meta: "4.4★ · 2,310 ratings"
    },
    {
      store: "Flipkart",
      color: "#2874f0",
      initial: "f",
      title: "ProStride Comfort-Fit Sports Shoes",
      description: "Orthotic-friendly footbed with reinforced arch zone. A popular pick for everyday walking and light jogging.",
      price: "₹3,799",
      meta: "4.2★ · 980 ratings"
    },
    {
      store: "Myntra",
      color: "#ff3f6c",
      initial: "m",
      title: "TrailLite Everyday Running Sneakers",
      description: "Soft cushioned midsole with extra arch padding, built for all-day comfort and flat-foot stability.",
      price: "₹5,499",
      meta: "4.5★ · 612 ratings"
    },
    {
      store: "Decathlon",
      color: "#0082c3",
      initial: "d",
      title: "Kalenji Run Support+ Trainers",
      description: "Engineered specifically for overpronation and flat arches, with a firmer medial support panel.",
      price: "₹2,999",
      meta: "4.6★ · 1,540 ratings"
    }
  ];

  // ---------------- elements ----------------
  const greeting = document.getElementById('greeting');
  const results = document.getElementById('results');
  const queryInput = document.getElementById('queryInput');
  const sendBtn = document.getElementById('sendBtn');
  const backBtn = document.getElementById('backBtn');
  const categorySelect = document.getElementById('categorySelect');
  const queryEcho = document.getElementById('queryEcho');
  const resultsList = document.getElementById('resultsList');
  const loadingWrap = document.getElementById('loadingWrap');

  // auto-grow textarea
  queryInput.addEventListener('input', () => {
    queryInput.style.height = 'auto';
    queryInput.style.height = Math.min(queryInput.scrollHeight, 200) + 'px';
  });

  queryInput.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      runSearch();
    }
  });

  sendBtn.addEventListener('click', runSearch);

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      queryInput.value = chip.dataset.fill;
      queryInput.dispatchEvent(new Event('input'));
      runSearch();
    });
  });

  backBtn.addEventListener('click', () => {
    results.classList.remove('active');
    greeting.classList.add('active');
  });

  function runSearch(){
    const query = queryInput.value.trim();
    if (!query) { queryInput.focus(); return; }

    greeting.classList.remove('active');
    results.classList.add('active');
    queryEcho.textContent = query;
    resultsList.innerHTML = '';
    loadingWrap.style.display = 'flex';

    fetch('http://localhost:8000', {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: query
    })
    .then(r => {
      if (!r.ok) {
        throw new Error('HTTP error with status code ' + r.status)
      }
      return r.json();
    })
    .then(data => {
      loadingWrap.style.display = 'none';
      renderResults(data);
    })
    .catch(e => {
      loadingWrap.style.display = 'none';
      errorMsg.hidden = false;
      console.error(e.message);
    });
  }

  function renderResults(items){
    resultsList.innerHTML = items.map(item => `
      <article class="result-card">
        <div class="source-row">
          <span class="source-badge" style="background:${item.color}">
            <span class="swatch">${item.initial}</span>${item.store}
          </span>
          <span class="price-tag">${item.price}</span>
        </div>
        <h3>${item.title}</h3>
        <p>${item.description}</p>
        <div class="card-footer">
          <span class="meta">${item.meta}</span>
          <a href="${item.link}" class="view-link">
            View product
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </a>
        </div>
      </article>
    `).join('');
  }
</script>
</body>
</html>
